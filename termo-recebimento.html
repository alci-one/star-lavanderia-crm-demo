*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{background:var(--navy);color:white;padding:12px max(18px,calc((100% - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px}header img{width:72px;height:auto;border-radius:7px;background:white}header strong{flex:1}header span{color:#ffe1bd;background:#3c4059;border-radius:8px;padding:5px 9px;font-size:.84rem}main{max-width:1100px;margin:auto;padding:22px 18px 44px}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.9rem,5vw,2.7rem);letter-spacing:-.035em;line-height:1.15}h2{font-size:1.18rem}h3{font-size:1rem}.sub{color:var(--muted);margin:8px 0 16px;line-height:1.45}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.pieces{display:grid;gap:10px}.fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(65px,.55fr) minmax(0,1fr);gap:9px;margin:12px 0}.piece{border:1px solid var(--line);background:#f7f9fd;border-radius:12px;padding:13px}.pieceTitle{color:#254580}.observations{margin-top:10px}label{display:grid;gap:5px;font-size:.9rem;font-weight:650}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #b9c9df;padding:9px;border-radius:8px;background:white;color:#162b48}textarea{resize:vertical}fieldset{border:0;padding:0;margin:10px 0}legend{font-size:.9rem;font-weight:650;margin-bottom:7px}.checks,.actions{display:flex;gap:8px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px}.checks input{width:auto}button{border:1px solid var(--line);border-radius:8px;color:#183457;background:#fff;padding:8px 11px;cursor:pointer;font-weight:650;min-height:40px}button:hover{background:#eaf0ff}button:disabled{opacity:.55;cursor:default}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1c367d}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ed8c3e;outline-offset:2px}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{margin:0;width:115px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.thumb img{display:block;width:100%;height:83px;object-fit:cover}.thumb button{width:100%;border:0;min-height:32px;font-size:.79rem}.hint{color:var(--muted);font-size:.87rem;margin:7px 0}.status{margin-top:8px;color:#125b43}.error{color:#97263b}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.meta p{margin-top:4px}.sheetItem{break-inside:avoid;border-top:1px solid var(--line);margin-top:13px;padding-top:12px}.sheetItem p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.sheetPhotos{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}.sheetPhotos img{width:110px;height:85px;object-fit:contain;border:1px solid var(--line)}.signs{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:35px;break-inside:avoid}.signs div{border-top:1px solid #8294ad;padding-top:5px;font-size:.85rem}.sheetTitle img{width:76px;height:auto}.sheetTitle{display:flex;align-items:center;gap:12px;margin-bottom:13px}.sheetTitle span{font-size:.83rem;color:var(--muted)}dialog{border:0;border-radius:14px;width:min(700px,94vw);max-height:90vh;padding:17px;color:#162b48}dialog::backdrop{background:#13284999}video{width:100%;max-height:53vh;background:#132849;border-radius:8px;display:block;margin:10px 0}

<h1>Termo de recebimento</h1><p class="sub">Registre as peças e as condições observadas no balcão, antes da lavagem.</p>
<form id="form">
<section class="panel"><h2>Identificação da entrega</h2><div class="grid">
<label>Cliente<input id="customer" required maxlength="120" value="Marina Costa (Demo)"></label>
<label>Ordem de serviço<input id="order" maxlength="30" value="0007"></label>
<label>Recebido por<input id="operator" required maxlength="100" value="Atendimento (Demo)"></label>
<label>Data e hora<input id="received" type="datetime-local" required></label>
</div></section>
<section class="panel"><div class="row"><h2>Itens recebidos</h2><button id="add" type="button">+ Adicionar item</button></div><p class="hint">Separe em itens diferentes as peças que tenham condições distintas.</p><div id="items" class="pieces"></div></section>
<section class="panel"><label>Observações gerais<textarea id="general" rows="2" maxlength="1200" placeholder="Ex. prazo de retirada combinado, acessórios recebidos ou ressalvas"></textarea></label></section>
<div class="actions"><button class="primary">Gerar termo para conferência</button></div><p id="feedback" class="status" role="status"></p>
</form>
<section id="sheet" class="panel" hidden aria-labelledby="sheetHeading"><div id="sheetContent"></div><div class="actions screenOnly" style="margin-top:18px"><button id="print" class="primary" type="button">Imprimir / salvar em PDF</button></div></section>
</main>

 return item;
}
function drawItems(){
 $('items').innerHTML=items.map((item,i)=>'<article class="piece" data-item="'+item.id+'"><div class="row"><h3 class="pieceTitle">Item '+(i+1)+'</h3><button data-action="remove" type="button" '+(items.length===1?'disabled':'')+'>Remover item</button></div><div class="fields"><label>Peça ou item<input data-field="name" required maxlength="90" placeholder="Ex. Edredom casal" value="'+escapeHtml(item.name)+'"></label><label>Quantidade<input data-field="qty" type="number" required min="1" max="9999" step="1" value="'+escapeHtml(item.qty)+'"></label><label>Cor ou identificação<input data-field="color" maxlength="65" placeholder="Ex. Azul" value="'+escapeHtml(item.color)+'"></label></div><fieldset><legend>Condições observadas</legend><div class="checks"><label><input type="checkbox" data-issue="" '+(!item.issues.length?'checked':'')+'>Sem avarias aparentes</label>'+conditions.map(s=>'<label><input type="checkbox" data-issue="'+escapeHtml(s)+'" '+(item.issues.includes(s)?'checked':'')+'>'+escapeHtml(s)+'</label>').join('')+'</div></fieldset><label class="observations">Detalhes da condição<textarea data-field="notes" rows="2" maxlength="700" placeholder="Ex. Mancha de cerca de 3 cm na manga direita.">'+escapeHtml(item.notes)+'</textarea></label><div class="actions" style="margin-top:9px"><button data-action="attach" type="button">Anexar fotos</button><button data-action="camera" type="button">Tirar foto</button></div><input data-file type="file" accept="image/*" multiple hidden><input data-capture type="file" accept="image/*" capture="environment" hidden><p class="hint">Até 6 fotos por item. As imagens são incluídas no termo.</p><div class="photos">'+item.photos.map((src,n)=>'<figure class="thumb"><img src="'+src+'" alt="Foto '+(n+1)+' do item '+(i+1)+'"><button type="button" data-action="removePhoto" data-n="'+n+'">Remover foto '+(n+1)+'</button></figure>').join('')+'</div></article>').join('');
}
function getItem(el){return items.find(i=>i.id===Number(el.closest('[data-item]')?.dataset.item));}
function invalidate(){ $('sheet').hidden=true;$('feedback').textContent=''; }
function imageSize(w,h){const scale=Math.min(1,1200/Math.max(w,h));return [Math.max(1,Math.round(w*scale)),Math.max(1,Math.round(h*scale))];}
function scaledImage(source,w,h){
 const [width,height]=imageSize(w,h),canvas=document.createElement('canvas');
 canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(source,0,0,width,height);
 return canvas.toDataURL('image/jpeg',.82);
}
async function readPhoto(file){
 const url=URL.createObjectURL(file);
 try{
  const img=new Image();img.src=url;await img.decode();
  return scaledImage(img,img.naturalWidth,img.naturalHeight);
 }finally{URL.revokeObjectURL(url);}
}
function notify(message,error=false){$('feedback').className=error?'status error':'status';$('feedback').textContent=message;}
async function addPhotos(input,item){
 const files=Array.from(input.files||[]);
 input.value='';
 let count=0;const failures=[];
 for(const file of files){
  if(item.photos.length>=6){failures.push('Limite de 6 fotos por item.');break;}
  try{
   if(file.size>16*1024*1024)throw new Error();
   const src=await readPhoto(file);
   if(!items.includes(item))return;
   if(item.photos.length>=6){failures.push('Limite de 6 fotos por item.');break;}
   item.photos.push(src);count++;
  }catch{failures.push('Use uma imagem compatível de até 16 MB.');}
 }
 if(count){invalidate();drawItems();}
 if(count||failures.length)notify((count?count+' foto(s) anexada(s). ':'')+[...new Set(failures)].join(' '),Boolean(failures.length));
}
$('items').oninput=e=>{const item=getItem(e.target);if(item&&e.target.dataset.field){item[e.target.dataset.field]=e.target.value;invalidate();}};
$('items').onchange=e=>{
 const item=getItem(e.target);if(!item)return;
 if(e.target.matches('[data-file],[data-capture]')){addPhotos(e.target,item);return;}
 if(!e.target.hasAttribute('data-issue'))return;
 const issue=e.target.dataset.issue;
 if(!issue)item.issues=[];
 else if(e.target.checked)item.issues.push(issue);
 else item.issues=item.issues.filter(s=>s!==issue);
 const field=e.target.closest('fieldset');
 for(const box of field.querySelectorAll('[data-issue]'))box.checked=box.dataset.issue?item.issues.includes(box.dataset.issue):!item.issues.length;
 invalidate();
};
function itemPanel(item){return $('items').querySelector('[data-item="'+item.id+'"]');}
$('items').onclick=e=>{
 const button=e.target.closest('[data-action]');if(!button)return;
 const item=getItem(button);if(!item)return;
 const action=button.dataset.action;
 if(action==='remove'&&items.length>1){items=items.filter(i=>i!==item);invalidate();drawItems();}
 if(action==='removePhoto'){item.photos.splice(Number(button.dataset.n),1);invalidate();drawItems();}
 if(action==='attach')itemPanel(item).querySelector('[data-file]').click();
 if(action==='camera')openCamera(item);
};
function stopCamera(){
 requestId++;stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('take').disabled=true;
}
async function openCamera(item){
 if(item.photos.length>=6){notify('Limite de 6 fotos por item.',true);return;}
 if(!navigator.mediaDevices?.getUserMedia){itemPanel(item).querySelector('[data-capture]').click();return;}
 cameraItem=item;$('cameraMsg').textContent='Aguardando autorização da câmera.';
 $('camera').showModal();const pending=++requestId;
 try{
  const active=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  if(!$('camera').open||pending!==requestId){active.getTracks().forEach(t=>t.stop());return;}
  stream=active;$('video').srcObject=stream;await $('video').play();
  if(pending===requestId&&$('camera').open){$('cameraMsg').textContent='Enquadre a peça e capture a foto.';$('take').disabled=false;}
 }catch{if(pending===requestId)$('cameraMsg').textContent='Câmera indisponível. Use a câmera do aparelho ou anexe uma foto.';}
}
$('camera').onclose=stopCamera;
$('closeCamera').onclick=()=>$('camera').close();
$('nativeCamera').onclick=()=>{const panel=itemPanel(cameraItem);$('camera').close();panel?.querySelector('[data-capture]').click();};
$('take').onclick=()=>{
 const video=$('video');
 if(!video.videoWidth||!cameraItem||cameraItem.photos.length>=6)return;
 cameraItem.photos.push(scaledImage(video,video.videoWidth,video.videoHeight));$('camera').close();invalidate();drawItems();notify('Foto capturada e anexada ao item.');
};
$('form').addEventListener('input',e=>{if(!e.target.closest('#items'))invalidate();});
$('add').onclick=()=>{addItem();invalidate();itemPanel(items.at(-1)).querySelector('[data-field="name"]').focus();};
$('form').onsubmit=e=>{
 e.preventDefault();
 if(!$('customer').value.trim()||!$('operator').value.trim()||items.some(i=>!i.name.trim())){
  notify('Preencha cliente, responsável pelo recebimento e descrição de cada peça.',true);return;
 }
 const [d,t]=$('received').value.split('T');
 $('sheetContent').innerHTML='<div class="sheetTitle"><img src="'+logo+'" alt="Star Lavanderia"><div><h2 id="sheetHeading">Termo de recebimento de peças</h2><span>Star Lavanderia · Modelo demonstrativo</span></div></div><div class="meta"><div><strong>Cliente</strong><p>'+escapeHtml($('customer').value)+'</p></div><div><strong>Ordem de serviço</strong><p>'+escapeHtml($('order').value||'Não informada')+'</p></div><div><strong>Recebido por</strong><p>'+escapeHtml($('operator').value)+'</p></div><div><strong>Data e hora</strong><p>'+escapeHtml(d.split('-').reverse().join('/')+' às '+t)+'</p></div></div>'+items.map((i,n)=>'<article class="sheetItem"><h3>Item '+(n+1)+' · '+escapeHtml(i.qty)+' × '+escapeHtml(i.name)+'</h3>'+(i.color?'<p><strong>Identificação:</strong> '+escapeHtml(i.color)+'</p>':'')+'<p><strong>Condição observada:</strong> '+escapeHtml(i.issues.join(', ')||'Sem avarias aparentes')+'</p>'+(i.notes?'<p><strong>Detalhes:</strong> '+escapeHtml(i.notes)+'</p>':'')+'<div class="sheetPhotos">'+i.photos.map((src,k)=>'<img src="'+src+'" alt="Foto '+(k+1)+' do item '+(n+1)+'">').join('')+'</div></article>').join('')+($('general').value.trim()?'<p class="sheetItem" style="white-space:pre-wrap;overflow-wrap:anywhere"><strong>Observações gerais:</strong> '+escapeHtml($('general').value.trim())+'</p>':'')+'<div class="signs"><div>Assinatura do cliente</div><div>Assinatura do responsável pelo recebimento</div></div>';
 $('sheet').hidden=false;$('sheet').scrollIntoView({block:'start'});notify('Termo gerado para conferência.');
};
$('print').onclick=()=>window.print();
addItem({name:'Edredom casal',color:'Azul marinho',issues:['Mancha','Costura solta'],notes:'Mancha clara no canto inferior e costura aberta de aproximadamente 2 cm.'});
addItem({name:'Camisa social',qty:2,color:'Branca',notes:''});
addItem({name:'Calça jeans',color:'Azul',issues:['Rasgo ou furo','Desgaste'],notes:'Pequeno rasgo no joelho esquerdo e desgaste na barra.'});
document.getElementById('general').value='Exemplo fictício: retirada prevista para sexta-feira à tarde.';
</script></html>
